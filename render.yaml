# Render deploy config for v3 - TeraBestBot-like, public bot.
# This is a Web Service so Render gives it a public URL.
# That URL powers the 🌐 Online Player button, so others can use it
# even when your PC is off.
# Free tier sleeps after ~15 min of no use - first message after a gap
# may take 30-60 seconds to wake up. That is normal on free Render.
services:
  - type: web
    name: telegram-link-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      # Pin Python to 3.12 - Render defaulted to 3.14.10, and PTB 21.6
      # crashed there with "no current event loop". PTB is now 22.8
      # (which fixed that in 22.4), but 3.12 is the version we tested.
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: BOT_TOKEN
        sync: false
      # Optional in v3 - bot tries guest / no-login first.
      # Fill it only if a link fails with empty dlink.
      - key: TERABOX_COOKIE
        sync: false
      # Your Render URL, e.g. https://telegram-link-bot-xxxx.onrender.com
      # Set this AFTER the first deploy (Render shows the URL then).
      # It powers the "Online Player" button.
      - key: PUBLIC_URL
        sync: false
      # Leave blank = allow everyone to use the bot, like @TeraBestBot.
      # To allow only you, put your Telegram user ID here.
      - key: ALLOWED_USER_IDS
        value: ""
